name: 🐛 Signaler un bug
description: Quelque chose ne fonctionne pas comme prévu.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème ! Vérifiez d'abord qu'une issue similaire n'existe pas déjà.
        Une faille de sécurité ne se signale jamais ici : voir `SECURITY.md`.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur …
        2. Cliquer sur …
        3. Constater …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      description: Version ou commit, plateforme (iOS, Android, navigateur), local ou en ligne.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Copiez les logs utiles, ils seront mis en forme automatiquement.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran
