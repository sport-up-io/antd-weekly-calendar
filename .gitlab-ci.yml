# #############################################################################
# ## CONFIGURATION
# #############################################################################

include:
  # Templates CI⚡CD
  # 📄 Documentation: https://gitlab.com/sport-up-group/sportup-templates
  - project: sport-up-group/sportup-templates
    ref: main
    file: main.yml
  # Automatic Config Environment
  # Configue automaticly the environment from .env on develop, staging or tags
  - project: sport-up-group/sportup-templates
    ref: main
    file: config-env.yml
  # Version flow CI⚡CD : une seule branche main
  # MR → tests, main → build et tests, 🔖 Versioning → tag vX.Y.Z → publication npm
  - project: sport-up-group/sportup-templates
    ref: main
    file: version-flow.yml

stages:
  - ⚙️ Config
  - 🔑 Authentication
  - 🛠️ Build
  - 🧪 Test
  - 🔖 Versioning
  - 🔬 Analyse

variables:
  NEED_ENV: false

# #############################################################################
# ## AUTHENTICATION
# #############################################################################

gitlab:npmrc:
  extends: .gitlab:npmrc
  stage: 🔑 Authentication
  only:
    - main
    - tags
    - merge_requests

# #############################################################################
# ## BUILD
# #############################################################################

node:install:
  extends: .node:install
  stage: 🛠️ Build
  needs: ['gitlab:npmrc']
  only:
    - main
    - tags
    - merge_requests

node:build:
  extends: .node:build
  stage: 🛠️ Build
  needs: ['node:install']
  only:
    - main
    - tags
    - merge_requests

# #############################################################################
# ## TEST
# #############################################################################

node:test:
  extends: .node:test
  stage: 🧪 Test
  needs: ['node:install']
  only:
    - main
    - merge_requests

# #############################################################################
# ## 🔖 VERSIONING (tag : publication npm et release GitLab)
# #############################################################################

node:publish:
  extends: .node:publish
  stage: 🔖 Versioning
  needs: ['node:build']

release:create:
  extends: .release:create
  stage: 🔖 Versioning

# #############################################################################
# ## ANALYSE
# #############################################################################

sonarqube:check:
  extends: .sonarqube:check
  stage: 🔬 Analyse
  needs: ['node:test']
  only:
    - main
